spring:
  application:
    name: smartlibrary
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bookcloud_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASS:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Local development default: Keycloak runs on the host at :8180.
          # The backend still lets you override this with KEYCLOAK_JWKS_URI if needed.
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/bookcloud/protocol/openid-connect/certs}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  frontend:
    origin: ${APP_FRONTEND_ORIGIN:http://localhost:4200}
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:bookcloud}
    client-id: ${KEYCLOAK_CLIENT_ID:bookcloud-frontend}
    frontend-redirect-uri: ${KEYCLOAK_REDIRECT_URI:http://localhost:4200/home}
    admin-realm: ${KEYCLOAK_ADMIN_REALM:master}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    admin-username: ${KEYCLOAK_ADMIN:admin}
    admin-password: ${KC_ADMIN_PASS:admin}
  loan-default-days: ${APP_LOAN_DEFAULT_DAYS:14}
  reservation-expiry-days: ${APP_RESERVATION_EXPIRY_DAYS:7}
  max-renewals-per-loan: ${APP_MAX_RENEWALS_PER_LOAN:2}
  overdue-fine-per-day-cents: ${APP_OVERDUE_FINE_PER_DAY_CENTS:0}

cloudinary:
  enabled: ${CLOUDINARY_ENABLED:true}
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:bookcloud/partners}
  category-folder: ${CLOUDINARY_CATEGORY_FOLDER:bookcloud/categories}
  book-folder: ${CLOUDINARY_BOOK_FOLDER:bookcloud/books}
  author-folder: ${CLOUDINARY_AUTHOR_FOLDER:bookcloud/authors}
  news-folder: ${CLOUDINARY_NEWS_FOLDER:bookcloud/news}
